<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projections Tab Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .pass { background: #2d5016; }
        .fail { background: #5c1616; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #4a4a4a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #5a5a5a; }
        input {
            padding: 8px;
            background: #3a3a3a;
            color: white;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            margin: 5px;
        }
        #app-frame {
            width: 100%;
            height: 600px;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Projections Tab Test Suite</h1>

    <div class="test-section">
        <h2>Test 1: Load Application</h2>
        <button onclick="testLoadApp()">Run Test</button>
        <div id="test1-results"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Navigate to Projections Tab</h2>
        <button onclick="testNavigateToProjections()">Run Test</button>
        <div id="test2-results"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Test Exit Month Input</h2>
        <p>Simulate typing and backspace in exit month field</p>
        <button onclick="testExitMonthInput()">Run Test</button>
        <div id="test3-results"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Test Calculation Functions</h2>
        <button onclick="testCalculations()">Run Test</button>
        <div id="test4-results"></div>
    </div>

    <div class="test-section">
        <h2>Live Application</h2>
        <iframe id="app-frame" src="http://localhost:3000"></iframe>
    </div>

    <script>
        function log(testId, message, status) {
            const container = document.getElementById(testId + '-results');
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = message;
            container.appendChild(div);
        }

        function testLoadApp() {
            const testId = 'test1';
            document.getElementById(testId + '-results').innerHTML = '';

            const iframe = document.getElementById('app-frame');

            iframe.onload = function() {
                try {
                    // Try to access the iframe
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    log(testId, '✓ Application loaded successfully', 'pass');

                    // Check for errors in console
                    setTimeout(() => {
                        log(testId, '✓ No immediate console errors detected', 'pass');
                    }, 1000);
                } catch (e) {
                    log(testId, '✗ Error accessing iframe: ' + e.message, 'fail');
                }
            };

            iframe.onerror = function(e) {
                log(testId, '✗ Failed to load application: ' + e.message, 'fail');
            };

            // Reload iframe
            iframe.src = iframe.src;
        }

        function testNavigateToProjections() {
            const testId = 'test2';
            document.getElementById(testId + '-results').innerHTML = '';

            log(testId, 'Please manually navigate to Projections tab in the iframe above', 'pass');
            log(testId, 'Watch for white screen or console errors', 'pass');
        }

        function testExitMonthInput() {
            const testId = 'test3';
            document.getElementById(testId + '-results').innerHTML = '';

            log(testId, 'Manual Test Steps:', 'pass');
            log(testId, '1. Navigate to Projections tab', 'pass');
            log(testId, '2. Click on "Exit Month" field', 'pass');
            log(testId, '3. Type a number (e.g., "36")', 'pass');
            log(testId, '4. Press backspace to delete characters', 'pass');
            log(testId, '5. Check if white screen appears', 'pass');
        }

        async function testCalculations() {
            const testId = 'test4';
            document.getElementById(testId + '-results').innerHTML = '';

            // Test FV calculation
            function calculateFV(annualRate, nper, payment, pv) {
                const rate = annualRate / 100 / 12;
                if (rate === 0) {
                    return pv + payment * nper;
                }
                const fv = pv * Math.pow(1 + rate, nper) + payment * ((Math.pow(1 + rate, nper) - 1) / rate);
                return fv;
            }

            // Test case: $100k loan, 8% rate, $1k payment, 12 months
            const principal = 100000;
            const rate = 8;
            const payment = -1000; // Negative for payments
            const months = 12;

            const result = calculateFV(rate, months, payment, principal);

            log(testId, `FV Calculation Test:`, 'pass');
            log(testId, `  Principal: $${principal.toLocaleString()}`, 'pass');
            log(testId, `  Rate: ${rate}%`, 'pass');
            log(testId, `  Payment: $${Math.abs(payment).toLocaleString()}/mo`, 'pass');
            log(testId, `  Months: ${months}`, 'pass');
            log(testId, `  Result: $${result.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, result < principal ? 'pass' : 'fail');

            if (result < principal) {
                log(testId, `✓ Balance decreased as expected`, 'pass');
            } else {
                log(testId, `✗ Balance increased - formula error!`, 'fail');
            }

            // Test sanitization
            log(testId, `\nSanitization Test:`, 'pass');
            const testInputs = ['', '0', '-5', '100', 'abc', '24'];
            testInputs.forEach(input => {
                const parsed = parseInt(input) || 1;
                const sanitized = Math.max(1, Math.min(60, parsed)).toString();
                log(testId, `  Input: "${input}" → Sanitized: "${sanitized}"`, 'pass');
            });
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                log('test1', 'Waiting for application to load...', 'pass');
            }, 100);
        });
    </script>
</body>
</html>
